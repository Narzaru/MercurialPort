# Прикрепляет собранный плагин к опубликованному GitHub-релизу.
#
# Публикации в JetBrains Marketplace здесь нет: плагин распространяется только через
# GitHub Releases, а publishPlugin требовал секретов (PUBLISH_TOKEN, PRIVATE_KEY,
# PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN) и падал раньше, чем zip успевал прикрепиться.
#
# Релизы делаются только с main — иначе в релиз может уехать код, не прошедший проверки.

name: Release
on:
  release:
    types: [ prereleased, released ]

jobs:

  release:
    name: Attach Plugin Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the released revision along with main, чтобы проверить принадлежность ветке
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # Релиз только с main: тег должен быть предком (или самим) HEAD ветки main
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Тег ${{ github.event.release.tag_name }} не входит в main — релиз отменён."
            exit 1
          fi

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build plugin
        run: ./gradlew buildPlugin

      # Upload an artifact as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*.zip --clobber
